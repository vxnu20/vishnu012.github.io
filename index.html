<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vishnu</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    :root {
      --bg: #fafafa;
      --text: #111;
      --muted: #666;
      --border: #ddd;
      --link: #0057cc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --text: #ececec;
        --muted: #8d8d8d;
        --border: #2b2b2b;
        --link: #6ea8ff;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.7 SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 28px 40px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    section {
      margin-bottom: 1.75rem;
    }

    h2 {
      font-size: .95rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: .9rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    p {
      max-width: 60ch;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    ul {
      list-style: none;
    }

    li {
      margin-bottom: 1.5rem;
    }

    .small {
      display: block;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: .25rem;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--link);
      text-decoration-color: var(--link);
    }

    i {
      width: 20px;
      margin-right: 8px;
      color: var(--muted);
    }

    footer {
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width:600px) {
      body {
        font-size: 15px;
      }

      main {
        padding: 20px 24px 32px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>Vishnu Udayan</h1>

    <section>
      <p>
        Just another corporate guy in his 20s, Genuinely curious about everything—except my own
        life choices.

                </a>
            </li>

    </section>

  </main>

</body>

</html>
